name: Weekly Sanity Backup

permissions:
  contents: write

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Export Sanity dataset
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
        run: node scripts/backup-sanity.mjs

      - name: Commit and push backup file
        run: |
          git config user.name "Sanity Backup Bot"
          git config user.email "actions@github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "Automated weekly Sanity backup"
          git push
